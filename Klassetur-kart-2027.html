<\/b><small>Gamleby, festning og Ponta da Piedade<\/small><\/div><span class=\"act\">120 kr<\/span><\/li><li><div class=\"day\"><b>Slide & Splash<\/b><small>Vannpark ved Lagoa, buss tur/retur<\/small><\/div><span class=\"act\">390 kr<\/span><\/li><li><div class=\"day\"><b>Surfing eller SUP<\/b><small>Introkurs på stranda<\/small><\/div><span class=\"act\">470 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Faro – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Alvor er en rolig base med restauranter i gangavstand. Albufeira er utelatt fordi utelivsstripa der er innrettet mot aldersgruppen rett over elevenes.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Pestana Alvor Praia<\/b><span class=\"basis\">Praia dos Três Irmãos, Portimão · +351 282 400 900 · egen strandadkomst, flere basseng, stor kapasitet<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Tivoli Alvor Algarve<\/b><span class=\"basis\">Avenida José Saramago, Alvor · +351 282 248 700 · stort anlegg, ti minutter til stranda<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>Alta<\/b><small>billigste busstur, 17 000<\/small><\/div>\n      <div><b>~395 800<\/b><small>kroner totalt, estimat<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Aerial_view_of_Diocletian%27s_Palace_in_Split%2C_Croatia_%2848608247353%29.jpg?width=1400\" alt=\"Diokletians palass sett ovenfra\"><figcaption>Palasset er fortsatt en bydel<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Peristyle_of_Diocletian%27s_Palace%2C_Split_%2811908116224%29.jpg?width=800\" alt=\"Peristyl i Diokletians palass\"><figcaption>Peristyl<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Dioklecijanova_pala%C4%8Da%2C_Split_-_jugoistok.JPG?width=800\" alt=\"Sørveggen av palasset mot Rivaen\"><figcaption>Rivaen og sørveggen<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\">\n      <div class=\"leg\"><b>Kautokeino &rarr; Alta<\/b><small>Buss &middot; ca. 2 t 45 min<\/small><\/div>\n      <div class=\"leg\"><b>Alta &rarr; Oslo<\/b><small>Norwegian eller SAS &middot; ca. 2 t<\/small><\/div>\n      <div class=\"leg\"><b>Oslo &rarr; Split<\/b><small>Norwegian, direkte om sommeren &middot; ca. 2 t 45 min<\/small><\/div>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--muted)\">Alta&ndash;Kreta direkte finnes ikke, verken med rutefly eller charter. Alle middelhavsreiser fra Finnmark g&aring;r via Oslo eller Helsingfors.<\/p>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Diokletians palass<\/b><span class=\"basis\">Byen er bygd inne i et romersk keiserpalass fra år 305. Gratis å gå rundt i, kjellerhallene koster inngang.<\/span><\/li><li><b>Øyene Brač og Hvar<\/b><span class=\"basis\">Ferje fra Split. Zlatni Rat på Brač er stranda som skifter form med strømmen; en time hver vei.<\/span><\/li><li><b>Krka-fossene<\/b><span class=\"basis\">Nasjonalpark med fossefall i terrasser, halvannen time nordover. Bading er tillatt ved Skradinski buk.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>&Eacute;n aktivitet hver dag, strand resten av tiden<\/h3>\n    <ol class=\"days\">\n      <li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, innsjekk<\/small><\/div><span class=\"act\">&mdash;<\/span><\/li>\n      <li><div class=\"day\"><b>Diokletians palass<\/b><small>Kjellerne som er Meereen i Game of Thrones, Peristyl og Rivaen<\/small><\/div><span class=\"act\">120 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Krka nasjonalpark<\/b><small>Fossene ved Skradinski buk, dagstur med buss<\/small><\/div><span class=\"act\">295 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Ba&#269;vice-stranda<\/b><small>Bading og picigin, det lokale spillet i grunt vann<\/small><\/div><span class=\"act\">&mdash;<\/span><\/li>\n      <li><div class=\"day\"><b>B&aring;t til Bra&#269;<\/b><small>Zlatni Rat, en av Adriaterhavets mest kjente strender<\/small><\/div><span class=\"act\">165 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Klis festning og Trogir<\/b><small>Klis er ogs&aring; Meereen. Trogir st&aring;r p&aring; verdensarvlisten<\/small><\/div><span class=\"act\">95 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">&mdash;<\/span><\/li>\n      <li><div class=\"day\"><b>Hjemreise<\/b><small>Split &ndash; Oslo &ndash; Alta &ndash; Kautokeino<\/small><\/div><span class=\"act\">&mdash;<\/span><\/li>\n    <\/ol>\n    <p style=\"margin-top:16px;font-size:13px;color:var(--muted)\">Veiledende listepriser per person. Skolegrupper f&aring;r normalt redusert billett i nasjonalparkene. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <h3>Den vanskeligste posten i dette forslaget<\/h3>\n    <p class=\"lede\">28 senger i Split i juni er krevende. Byen har mange sm&aring; leiligheter og f&aring; store hus, s&aring; regn med enten et helt hostel eller tre&ndash;fire leiligheter i samme kvartal. Sp&oslash;r ogs&aring; om Podstrana og Trogir &mdash; tjue minutter unna, halve prisen, og lettere &aring; f&aring; alle under samme tak.<\/p>\n    <table style=\"margin-top:18px\">\n      <tr><td><b>Croparadise Split Hostel<\/b><span class=\"basis\">&#268;uli&#263;a dvori 29, Split &middot; +385 91 444 4194 &middot; flere hus i samme kvartal, kan ta hele gruppen<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n      <tr><td><b>Split Old Town Suites<\/b><span class=\"basis\">Marmontova 2, Split &middot; +385 95 506 6729 &middot; midt i gamlebyen, men mange trapper og ingen heis<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n      <tr><td><b>Leiligheter i Podstrana<\/b><span class=\"basis\">20 min med buss s&oslash;r for Split &middot; rimeligst, egen strand, roligere ramme for gruppen<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino&ndash;Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kj&oslash;ring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr>\n      <tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 &times; 5 000 &middot; Alta&ndash;Oslo ansl&aring;tt til 2 500, Oslo&ndash;Split til 2 500<\/span><\/td><td class=\"num\">140 000<\/td><\/tr>\n      <tr><td>Overnatting, 7 netter<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 &times; 7 &times; 450 &middot; flersengsrom eller leiligheter<\/span><\/td><td class=\"num\">88 200<\/td><\/tr>\n      <tr><td>Mat, lunsj og middag<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 &times; 7 &times; 340 &middot; dyrere enn Polen, billigere enn Norge<\/span><\/td><td class=\"num\">66 600<\/td><\/tr>\n      <tr><td>Lokaltransport og transfer<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">Flybuss, bybusser, ferge til Bra&#269;<\/span><\/td><td class=\"num\">10 000<\/td><\/tr>\n      <tr><td>Inngang og utflukter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">&Eacute;n aktivitet per dag, se programmet<\/span><\/td><td class=\"num\">30 000<\/td><\/tr>\n      <tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 &times; ca. 290<\/span><\/td><td class=\"num\">8 000<\/td><\/tr>\n      <tr><td>Buffer<\/td><td><span class=\"tag t-est\">10 %<\/span><span class=\"basis\">Valutasving, pris&oslash;kning, uforutsett<\/span><\/td><td class=\"num\">36 000<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">395 800<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>14 100<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 8<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke sl&aring;tt opp.<\/b> Alta&ndash;Oslo og Oslo&ndash;Split er satt til 2 500 kroner per etappe, som er et normalt sommerniv&aring;. Sommerprogrammet for juni 2027 er ikke lagt ut ennå, så prisen kan ikke hentes.\n    <\/div>\n  <\/section>\n\n\n\n  <footer>\n    Ikke inkludert: lommepenger, pass eller nasjonalt ID-kort, avbestillingsforsikring, egenandel ved sykdom.<br>\n    Valutakurs brukt i beregninge eino skole · 4.–10. juni 2027<\/p>\n    <h1>Malta<span>St. Paul's Bay<\/span><\/h1>\n    <p class=\"promise\">En øy på tredve ganger fjorten kilometer der alt går på engelsk og bussen tar dere overalt. Vanskelig å bli borte, lett å samle gjengen.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>17 400<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>487 120<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Bugibba_-_Malta_-_panoramio.jpg?width=1400\" alt=\"Buġibba, St. Paul's Bay\"><figcaption>Buġibba, St. Paul's Bay<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Malta_-_St._Paul's_Bay_-_Dawret_Il-Gzejjer_02.jpg?width=1400\" alt=\"Promenaden Dawret il-Gżejjer\"><figcaption>Promenaden Dawret il-Gżejjer<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Malta<\/b><small>Norwegian, direkte · ca. 3 t 55 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Valletta<\/b><span class=\"basis\">Hele hovedstaden står på verdensarvlisten. Barrakka-hagene, St. Johns-katedralen og fortet St. Elmo, 25 minutter med buss.<\/span><\/li><li><b>Gozo og Comino<\/b><span class=\"basis\">Ferje til nabo­øya, og Blue Lagoon på Comino med turkist vann over hvit sand.<\/span><\/li><li><b>Mdina<\/b><span class=\"basis\">Den stille middelalderbyen på høyden, brukt som Kings Landing i Game of Thrones. Under tre hundre innbyggere.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Øya som ramme, buss overalt<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer og innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Bading og bli kjent<\/b><small>Bugibba og badeplassene rundt bukta<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Valletta<\/b><small>Hovedstaden, Upper Barrakka og krigstunnelene fra 1940-tallet<\/small><\/div><span class=\"act\">180 kr<\/span><\/li><li><div class=\"day\"><b>Comino og Den blå lagune<\/b><small>Båt til øya mellom Malta og Gozo<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Mdina og Popeye Village<\/b><small>Middelalderbyen og filmkulissene fra 1980<\/small><\/div><span class=\"act\">230 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Snorkling og kajakk fra St. Paul's Bay<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Malta – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. St. Paul's Bay er valgt framfor Sliema og Paceville, som er øyas utelivsområde. Bussnettet gjør at gruppen kommer seg overalt uten leiebuss.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>ibis Styles St. Paul's Bay<\/b><span class=\"basis\">72 Triq Halel · +356 2166 0000 · nyest av alternativene, basseng på taket<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Topaz Hotel<\/b><span class=\"basis v>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\">\n      <div class=\"leg\"><b>Kautokeino → Kittilä<\/b><small>Buss · ca. 3 t 30 min<\/small><\/div>\n      <div class=\"leg\"><b>Kittilä → Helsingfors<\/b><small>Finnair · ca. 1 t 40 min<\/small><\/div>\n      <div class=\"leg\"><b>Helsingfors → Heraklion<\/b><small>Finnair, direkte · ca. 4 t<\/small><\/div>\n      <div class=\"leg\"><b>Heraklion → hotellet<\/b><small>Buss · ca. 1 t 15 min<\/small><\/div>\n    <\/div>\n    <p style=\"margin-top:16px\">Finnair flyr Helsingfors–Heraklion direkte fra mai til oktober, så ruten er i gang den første uka i juni. Sunclass flyr samme strekning og bør prises opp mot Finnair.<\/p>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Knossos<\/b><span class=\"basis\">Det minoiske palasset fra 1900 f.Kr. — Europas eldste by, med labyrinten og tronsalen. En time fra Rethymno.<\/span><\/li><li><b>Samaria-kløfta<\/b><span class=\"basis\">Europas lengste kløft, 16 kilometer nedover mellom 300 meter høye vegger, ut til sjøen. Heldagstur.<\/span><\/li><li><b>Balos og Elafonisi<\/b><span class=\"basis\">Lagune med rosa sand vest på øya. Kan nås med båt fra Kissamos.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Én aktivitet hver dag, resten er strand<\/h3>\n    <ol class=\"days\">\n      <li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer og innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li>\n      <li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Rutiner, grensene for hvor de kan bevege seg, bading<\/small><\/div><span class=\"act\">—<\/span><\/li>\n      <li><div class=\"day\"><b>Knossos<\/b><small>Minoisk palass fra 1900 f.Kr. Arkeologisk museum i Heraklion samme dag<\/small><\/div><span class=\"act\">235 + 140 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Fortezza i Rethymno<\/b><small>Venetiansk festning, gamlebyen og havna<\/small><\/div><span class=\"act\">50 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Spinalonga<\/b><small>Båt fra Plaka til leprakolonien. Historien fra «Øya»<\/small><\/div><span class=\"act\">295 + 95 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Kournas-sjøen<\/b><small>Kajakk og tredemølle-båter på Kretas eneste ferskvannssjø<\/small><\/div><span class=\"act\">120 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li>\n      <li><div class=\"day\"><b>Hjemreise<\/b><small>Heraklion – Helsingfors – Kittilä – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li>\n    <\/ol>\n    <p style=\"margin-top:16px;font-size:13px;color:var(--muted)\">Prisene er veiledende listepriser per person. EU-borgere under 25 har gratis inngang til greske arkeologiske steder — sjekk om EØS-borgere omfattes, det kan spare hele Knossos-posten. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <h3>Må bookes direkte — og hotellet må ta imot ungdomsgrupper<\/h3>\n    <p class=\"lede\">Ingen av disse er reservert. Flere greske hoteller avviser skolegrupper eller krever depositum, så det spørsmålet må stilles i første telefonsamtale. Malia og Hersonissos er utelatt med vilje: det er utelivsdestinasjoner og feil ramme for en klassetur.<\/p>\n    <table style=\"margin-top:18px\">\n      <tr><td><b>Rethymno Palace<\/b><span class=\"basis\">Adelianos Kampos, Rethymno · +30 2831 072418 · stort anlegg, egen strand, halvpensjon<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n      <tr><td><b>Atlantis Beach Hotel &amp; Spa<\/b><span class=\"basis\">Rethymno · +30 2831 051002 · gangavstand til gamlebyen, høyest vurdert<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n      <tr><td><b>Kiani Beach Resort<\/b><span class=\"basis\">Kalives, Chania · +30 2825 032300 · all-inclusive, lukket anlegg, egen vik<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Kittilä t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">26 200<\/td><\/tr>\n      <tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 6 300 · Kittilä–Helsingfors anslått til 2 800, Helsingfors–Heraklion til 3 500<\/span><\/td><td class=\"num\">176 400<\/td><\/tr>\n      <tr><td>Hotell med halvpensjon, 7 netter<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 7 × 700 · frokost og middag inkludert<\/span><\/td><td class=\"num\">137 200<\/td><\/tr>\n      <tr><td>Lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 7 × 140<\/span><\/td><td class=\"num\">27 400<\/td><\/tr>\n      <tr><td>Transfer og lokaltransport<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">Buss t/r Heraklion, lokalbusser til utfluktene<\/span><\/td><td class=\"num\">9 000<\/td><\/tr>\n      <tr><td>Inngang og utflukter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">Én aktivitet per dag, se programmet<\/span><\/td><td class=\"num\">35 000<\/td><\/tr>\n      <tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × ca. 290<\/span><\/td><td class=\"num\">8 000<\/td><\/tr>\n      <tr><td>Buffer<\/td><td><span class=\"tag t-est\">10 %<\/span><span class=\"basis\">Valutasving, prisøkning, uforutsett<\/span><\/td><td class=\"num\">41 900<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/ \n    h2{margin-bottom:8px} p{margin-bottom:6px} ol.days li{padding:5px 0} td{padding:5px 0}\n    .headline-num{margin-top:12px;padding-top:10px;gap:22px} .headline-num div b{font-size:22px}\n    footer{padding:12px 26px 16px}\n    @page{size:A4;margin:8mm}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"sheet\">\n  <div class=\"hero\">\n    <p class=\"kicker\">Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027<\/p>\n    <h1>Rhodos<span>Kolymbia på østkysten<\/span><\/h1>\n    <p class=\"promise\">Middelalderbyen står innenfor ridderborgens murer, og badevannet holder tjuefire grader i juni. Rolig strandby med utflukter i alle retninger.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>17 800<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>498 320<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/20210826-Lindos-DJI_0205.jpg?width=1400\" alt=\"Lindos med akropolis\"><figcaption>Lindos med akropolis<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Rhodos_Kolymbia_Beach_R01.jpg?width=1400\" alt=\"Stranda i Kolymbia\"><figcaption>Stranda i Kolymbia<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Rhodos<\/b><small>Charter, faste ukedager · ca. 4 t 15 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Rhodos gamleby<\/b><span class=\"basis\">Middelalderbyen til johannitterridderne, den største bebodde i Europa, innenfor fire kilometer bymur. Verdensarv.<\/span><\/li><li><b>Lindos<\/b><span class=\"basis\">Hvit landsby under en akropolis på en klippe over sjøen, 20 minutter sørover fra Kolymbia.<\/span><\/li><li><b>Sommerfugldalen og Epta Piges<\/b><span class=\"basis\">Skyggefull dal med tusenvis av sommerfugler i sesongen, og syv kilder med tunnel og innsjø rett ved Kolymbia.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strandbase med utflukter<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer og innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Kolymbia-bukta og eukalyptusalleen<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Rhodos by<\/b><small>Middelalderbyen innenfor murene, ridderveien og havna<\/small><\/div><span class=\"act\">110 kr<\/span><\/li><li><div class=\"day\"><b>Lindos<\/b><small>Akropolis på klippen og Sankt Pauls bukt<\/small><\/div><span class=\"act\">150 kr<\/span><\/li><li><div class=\"day\"><b>Sommerfugldalen og Epta Piges<\/b><small>De sju kildene, skog og bading<\/small><\/div><span class=\"act\">120 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Kajakk og snorkling fra Traounou-bukta<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Rhodos – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Kolymbia er valgt framfor Faliraki, som ligger tjue minutter unna og er øyas utelivssted. Charterrutene går faste ukedager, så datoene styres av flyet.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Cook's Club Kolymbia<\/b><span class=\"basis\">Vryxellon Street, Kolymbia · +30 2241 056600 · nyoppusset, stort bassengområde<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Niriides Hotel<\/b><span class=\"basis\">Kolymbia nord · +30 2241 056210 · 500 meter fra stranda, egen bukt for snorkling<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 5 700 · Alta–Oslo anslått til 2 500, Oslo–Rhodos til 3 200<\/span><\/td><td class=\"num\">159 600<\/td><\/tr><tr><td>Hotell, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 6 500<\/span><\/td><td class=\"num\">182 000<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 3 200 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">89 600<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 1 500 · én per dag, se programmet<\/span><\/td><td class=\"num\">42 000<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">498 320<\/td><\/tr>\n    <\/table>\n    < r(--muted)}\n  .warn{background:#FBF0DD;border-left:4px solid var(--amber);padding:14px 17px;margin-top:14px}\n  footer{padding:22px 44px 34px;font-size:12.5px;color:var(--muted)}\n  @media (max-width:700px){\n    .hero,section,footer{padding-left:22px;padding-right:22px}\n    .heroband{margin-left:-22px;margin-right:-22px}\n    .heroband div{padding-left:22px;padding-right:22px;flex-basis:50%}\n  }\n  @media print{\n    body{font-size:10px;line-height:1.4}\n    .hero{padding:16px 26px 0} .hero h1{font-size:38px}\n    .promise{font-size:13px;margin-top:10px}\n    .heroband{margin:14px -26px 0} .heroband div{padding:8px 26px 9px} .heroband b{font-size:15px}\n    .gallery img{height:120px}\n    section{padding:12px 26px;break-inside:avoid} h3{font-size:16px;margin-bottom:5px}\n    h2{margin-bottom:8px} p{margin-bottom:6px} ol.days li{padding:5px 0} td{padding:5px 0}\n    .headline-num{margin-top:12px;padding-top:10px;gap:22px} .headline-num div b{font-size:22px}\n    footer{padding:12px 26px 16px}\n    @page{size:A4;margin:8mm}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"sheet\">\n  <div class=\"hero\">\n    <p class=\"kicker\">Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027<\/p>\n    <h1>Island<span>Reykjavík, med Gullfoss og Geysir<\/span><\/h1>\n    <p class=\"promise\">Gullfoss, geysiren Strokkur og sprekken mellom Amerika og Europa på én dagstur, og en by med geotermiske bad. Dyrest i lista, men ulikt alt annet.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>18 000<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>503 920<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Gullfoss_from_the_Air_(cropped).jpg?width=1400\" alt=\"Gullfoss\"><figcaption>Gullfoss<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Reykjav%C3%ADk,_view_from_Hallgr%C3%ADmskirkja_(2).jpg?width=1400\" alt=\"Reykjavík sett fra Hallgrímskirkja\"><figcaption>Reykjavík sett fra Hallgrímskirkja<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Keflavík<\/b><small>Icelandair, SAS eller Norwegian, direkte · ca. 3 t 10 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Den gylne sirkel<\/b><span class=\"basis\">Þingvellir der de amerikanske og europeiske platene glir fra hverandre, geysiren Strokkur som går hvert tiende minutt, og Gullfoss.<\/span><\/li><li><b>Sørkysten<\/b><span class=\"basis\">Seljalandsfoss som du kan gå bak, Skógafoss på 60 meter, og den svarte stranda Reynisfjara med basaltsøyler.<\/span><\/li><li><b>Bad i byen<\/b><span class=\"basis\">Laugardalslaug ligger vegg i vegg med hostellet — utebasseng, varme kulper og sklie, åpent til klokka ti om kvelden.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Natur på dagsturer, bad i byen<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, buss fra Keflavík på 45 minutter, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Reykjavík<\/b><small>Hallgrímskirkja, havna og utebadet Laugardalslaug rett ved hostellet<\/small><\/div><span class=\"act\">110 kr<\/span><\/li><li><div class=\"day\"><b>Den gylne sirkel<\/b><small>Þingvellir, Geysir og Gullfoss, leiebuss hele dagen<\/small><\/div><span class=\"act\">800 kr<\/span><\/li><li><div class=\"day\"><b>Sørkysten<\/b><small>Seljalandsfoss, Skógafoss og den svarte stranda Reynisfjara, leiebuss<\/small><\/div><span class=\"act\">900 kr<\/span><\/li><li><div class=\"day\"><b>Blue Lagoon<\/b><small>Geotermisk bad i lavafeltet, fra 14 år<\/small><\/div><span class=\"act\">820 kr<\/span><\/li><li><div class=\"day\"><b>Perlan<\/b><small>Isgrotte, nordlysshow og utsiktsplattform over byen<\/small><\/div><span class=\"act\">450 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Shopping i Laugavegur, park, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Keflavík – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Dalur HI Hostel i Laugardalur tar skolegrupper og ligger vegg i vegg med byens største utebad. Island er det dyreste av reisemålene på mat og overnatting, så flersengsrom er lagt til grunn.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Dalur HI Hostel<\/b><span class=\"basis\">Sundlaugavegur 34, Reykjavík · +354 553 8110 · flersengsrom med inntil 6 senger, ved Laugardalslaug, gruppebestilling via hostel.is<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Loft HI Hostel<\/b><span class=\"basis\">Bankastræti 7, Reykjavík · +354 553 8140 · midt i sentrum, flersengsrom, frokost kan bestilles<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 5 300 · Alta–Oslo anslått til 2 500, Oslo–Keflavík til 2 800<\/span><\/td><td class=\"num\">148 400<\/td><\/tr><tr><td>Overnatting, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 5 600 · flersengsrom med frokost<\/span><\/td><td class=\"num\">156 800<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 3 200 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">89 600<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 3 000 · én per dag, se programmet<\/span><\/td><td class=\"num\">84 000<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">503 920<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>18 000<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 6<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke slått opp.<\/b> Sommerprogrammet for 2027 er ikke publisert ennå. Beløpet bygger på 2 500 kroner for Alta–Oslo og 2 800 for Oslo–Keflavík. Dagsturene er regnet med leiebuss for gruppen; åpne bussturer koster 1 000–1 300 kroner per person per tur. Kurs brukt: 1 000 ISK = 82 kr.\n    <\/div>\n  <\/section>\n\n  <footer>\n    Ikke inkludert: lommepenger, pass eller nasjonalt ID-kort, avbestillingsforsikring, egenandel ved sykdom.<br>\n    Bilder fra Wikimedia Commons: «Gullfoss from the Air (cropped)» av Nickspix (CC BY-SA 4.0) · «Reykjavík, view from Hallgrímskirkja (2)» av Olga Ernst (CC BY-SA 4.0).<br>\n    Alle beløp i kroner, avrundet. Modellen er frokost på hostellet og felles middag på restaurant, ikke all inclusive. Beløpene er uten buffer.\n  <\/footer>\n<\/div>\n<\/body>\n<\/html>\n"}]}</script>

function arc(a, b, n) {
  n = n || 64;
  const toR = Math.PI / 180, toD = 180 / Math.PI;
  const lat1 = a[0] * toR, lon1 = a[1] * toR, lat2 = b[0] * toR, lon2 = b[1] * toR;
  const d = 2 * Math.asin(Math.sqrt(Math.pow(Math.sin((lat1 - lat2) / 2), 2) + Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon1 - lon2) / 2), 2)));
  if (d < 1e-9) return [a, b];
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
    const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
    const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
    const z = A * Math.sin(lat1) + B * Math.sin(lat2);
    pts.push([Math.atan2(z, Math.sqrt(x * x + y * y)) * toD, Math.atan2(y, x) * toD]);
  }
  return pts;
}

function midpoint(pts) {
  let tot = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], (pts[i][1] - pts[i - 1][1]) * Math.cos(pts[i][0] * Math.PI / 180)); seg.push(d); tot += d; }
  let acc = 0;
  for (let i = 0; i < seg.length; i++) {
    if (acc + seg[i] >= tot / 2) { const f = seg[i] ? (tot / 2 - acc) / seg[i] : 0; return [pts[i][0] + f * (pts[i + 1][0] - pts[i][0]), pts[i][1] + f * (pts[i + 1][1] - pts[i][1])]; }
    acc += seg[i];
  }
  return pts[Math.floor(pts.length / 2)];
}
function visible() {
  return D.filter(d => state.from === 'alle' || d.ruter.some(r => r.fra === state.from));
}
function ruteFor(d) {
  if (state.from !== 'alle') { const i = d.ruter.findIndex(r => r.fra === state.from); if (i >= 0) return i; }
  return (state.sel === d.id) ? state.rute : 0;
}
function pris(d) { const r = d.ruter[ruteFor(d)]; return state.price === 'pp' ? r.pp : r.total; }
function tid(d) { return d.ruter[ruteFor(d)].reisetid.min; }
function fmtTid(m) { if (!m) return '–'; const t = Math.floor(m / 60), mi = m % 60; return (t ? t + ' t' : '') + (mi ? (t ? ' ' : '') + mi + ' min' : ''); }
function tidTekst(r) { const t = r.reisetid; return t.mangler.length ? (t.bareTransfer ? 'ca. ' + fmtTid(t.min) + ' + transfer' : 'minst ' + fmtTid(t.min)) : 'ca. ' + fmtTid(t.min); }

function homeView() {
  const pts = visible().map(d => [d.base.lat, d.base.lng]); pts.push([DATA.origo.lat, DATA.origo.lng]);
  map.fitBounds(L.latLngBounds(pts), {padding: [56, 40]});
}

/* prislapper med enkel kollisjonshåndtering */
function layoutPills() {
  pillLayer.clearLayers(); dotLayer.clearLayers();
  const vis = visible();
  const items = vis.map(d => ({d, p: map.latLngToContainerPoint([d.base.lat, d.base.lng])})).sort((a, b) => (state.sel === a.d.id ? -1 : state.sel === b.d.id ? 1 : 0) || pris(a.d) - pris(b.d));
  const clusters = [];
  items.forEach(it => {
    if (state.sel === it.d.id) { clusters.push({p: it.p, m: [it.d], sel: true}); return; }
    const selc = clusters.find(c => c.sel);
    if (selc && Math.abs(selc.p.x - it.p.x) < 120 && Math.abs(selc.p.y - it.p.y) < 60) return;   /* gir plass til den valgte */
    const c = clusters.find(c => !c.sel && Math.abs(c.p.x - it.p.x) < 86 && Math.abs(c.p.y - it.p.y) < 42);
    if (c) c.m.push(it.d); else clusters.push({p: it.p, m: [it.d]});
  });
  vis.forEach(d => L.circleMarker([d.base.lat, d.base.lng], {radius: 4, color: '#fff', weight: 1.5, fillColor: d.farge, fillOpacity: 1, interactive: false}).addTo(dotLayer));
  clusters.forEach(c => {
    const d = c.m[0];
    const ll = [d.base.lat, d.base.lng];
    let html, cls = '';
    if (c.m.length === 1) {
      cls = (state.sel === d.id ? ' sel' : '') + (state.hot === d.id ? ' hot' : '');
      html = `<div class="pill${cls}" style="--c:${d.farge}" data-id="${d.id}"><span class="pn">${esc(d.navn)}</span><span class="pp num">${fmt(pris(d))}</span></div>`;
    } else {
      const min = Math.min(...c.m.map(pris));
      html = `<div class="pill cl" data-cl="${c.m.map(x => x.id).join(',')}"><span class="pn">${c.m.length} reisemål</span><span class="pp num">fra ${fmt(min)}</span></div>`;
    }
    const mk = L.marker(ll, {icon: L.divIcon({className: 'pillwrap', iconSize: [0, 0], iconAnchor: [0, 0], html}), zIndexOffset: (state.sel === d.id ? 2000 : (c.m.length > 1 ? 500 : 0)), keyboard: false, riseOnHover: true});
    mk.on('click', () => {
      if (c.m.length === 1) select(d.id);
      else map.flyToBounds(L.latLngBounds(c.m.map(x => [x.base.lat, x.base.lng])), {padding: [90, 90], maxZoom: 9, duration: .7});
    });
    mk.on('mouseover', () => { if (c.m.length === 1) hover(d.id, true); });
    mk.on('mouseout', () => { if (c.m.length === 1) hover(d.id, false); });
    mk.addTo(pillLayer);
  });
}
map.on('zoomend moveend resize', layoutPills);

/* rute */
let nodeLayer = L.layerGroup().addTo(map);
let legLabels = [];
function legText(l) {
  const t = (l.info.match(/ca\.\s*[^·]+$/) || [''])[0].trim();
  const first = (l.info.split('·')[0] || '').trim();
  const mode = l.type === 'fly' ? 'Fly' : (l.type === 'tog' ? 'Tog' : (l.type === 'ferje' ? 'Ferje' : (l.type === 'buss' ? 'Buss' : ((first && !/^transfer/i.test(first) && first.length < 18) ? first : 'Transfer'))));
  return t ? mode + ' · ' + t : mode;
}
function layoutLegLabels() {
  legLabels.forEach(x => {
    const a = map.latLngToContainerPoint(x.a), b = map.latLngToContainerPoint(x.b);
    const len = Math.hypot(a.x - b.x, a.y - b.y);
    const el = x.marker.getElement(); if (!el) return;
    const lab = el.querySelector('.leglab'); if (lab) lab.classList.toggle('off', len < 90);
  });
}
map.on('zoomend moveend resize', layoutLegLabels);
function drawRoute(d, ri) {
  routeLayer.clearLayers(); nodeLayer.clearLayers(); legLabels = [];
  document.getElementById('legend').classList.toggle('show', !!d);
  if (!d) return;
  const r = d.ruter[ri];
  const all = [];
  r.legs.forEach(l => {
    let pts;
    if (l.type === 'buss') { pts = l.trase || [l.a, l.b]; L.polyline(pts, {color: '#fff', weight: 7, opacity: .9}).addTo(routeLayer); L.polyline(pts, {color: '#123A4A', weight: 3.5, dashArray: '7 7', lineCap: 'round'}).addTo(routeLayer); }
    else if (l.type === 'tog') { pts = [l.a, l.b]; L.polyline(pts, {color: '#fff', weight: 7, opacity: .9}).addTo(routeLayer); L.polyline(pts, {color: d.farge, weight: 3.5, dashArray: '14 5'}).addTo(routeLayer); }
    else if (l.type === 'ferje') { pts = [l.a, l.b]; L.polyline(pts, {color: '#fff', weight: 7, opacity: .9}).addTo(routeLayer); L.polyline(pts, {color: '#2E6B7A', weight: 3.5, dashArray: '2 6', lineCap: 'round'}).addTo(routeLayer); }
    else if (l.type === 'fly') { pts = arc(l.a, l.b); L.polyline(pts, {color: '#fff', weight: 7, opacity: .9}).addTo(routeLayer); L.polyline(pts, {color: d.farge, weight: 3.5}).addTo(routeLayer); }
    else { pts = [l.a, l.b]; L.polyline(pts, {color: '#fff', weight: 6, opacity: .9}).addTo(routeLayer); L.polyline(pts, {color: '#6B6459', weight: 2.5, dashArray: '2 7', lineCap: 'round'}).addTo(routeLayer); }
    pts.forEach(p => all.push(p));
    const mid = midpoint(pts);
    const col = (l.type === 'fly' || l.type === 'tog') ? d.farge : (l.type === 'buss' ? '#123A4A' : (l.type === 'ferje' ? '#2E6B7A' : '#6B6459'));
    const mk = L.marker(mid, {icon: L.divIcon({className: 'legwrap', iconSize: [0, 0], iconAnchor: [0, 0], html: `<div class="leglab" style="--c:${col}">${ICONS[l.type]}${esc(legText(l))}</div>`}), interactive: false, keyboard: false, zIndexOffset: 800}).addTo(routeLayer);
    legLabels.push({marker: mk, a: pts[0], b: pts[pts.length - 1]});
  });
  const node = (ll, label, cls, dir) => {
    const off = dir === 'bottom' ? [0, 8] : (dir === 'left' ? [-8, 0] : [8, 0]);
    L.circleMarker(ll, {radius: 5, color: '#fff', weight: 2, fillColor: cls === 'hub' ? '#A85434' : '#123A4A', fillOpacity: 1, interactive: false}).addTo(nodeLayer)
      .bindTooltip(label, {permanent: true, direction: dir || 'right', className: 'nodelabel ' + cls, offset: off, opacity: 1});
  };
  r.legs.forEach((l, i) => {
    if (l.type === 'transfer') return;
    const isHub = l.type !== 'buss' && i < r.legs.length - 1 && r.legs[i + 1].type !== 'transfer';
    const last = !r.legs.slice(i + 1).some(x => x.type !== 'transfer');
    const kode = l.tilKode ? ' (' + l.tilKode + ')' : (l.type === 'buss' && DATA.steder[l.til] && DATA.steder[l.til].kode ? ' (' + DATA.steder[l.til].kode + ')' : '');
    node(l.b, isHub ? (l.type === 'fly' ? 'Mellomlanding · ' : 'Omstigning · ') + l.til + kode : l.til + kode, isHub ? 'hub' : 'ap', last ? 'bottom' : 'right');
  });
  map.flyToBounds(L.latLngBounds(all), {padding: [60, 60], maxZoom: 7, duration: .8});
  layoutLegLabels();
}

/* ---------------- liste ---------------- */
function sorted(list) {
  const l = list.slice();
  if (state.sort === 'pris') l.sort((a, b) => pris(a) - pris(b) || a.navn.localeCompare(b.navn, 'nb'));
  else if (state.sort === 'navn') l.sort((a, b) => a.navn.localeCompare(b.navn, 'nb'));
  else if (state.sort === 'tid') l.sort((a, b) => tid(a) - tid(b) || pris(a) - pris(b));
  else l.sort((a, b) => a.regionNavn.localeCompare(b.regionNavn, 'nb') || pris(a) - pris(b));
  return l;
}

  pane.innerHTML = h;
  pane.scrollTop = 0;
  const CAM = '<svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>';
  pane.querySelectorAll('img[data-fb]').forEach(im => {
    const fb = () => { if (im.dataset.fb === 'fig') { const g = im.closest('.gallery'); im.parentNode.remove(); if (g && !g.children.length) { g.remove(); const c = pane.querySelector('.credit'); if (c) c.remove(); } } else im.parentNode.innerHTML = CAM; };
    if (im.complete && im.naturalWidth === 0) fb(); else im.addEventListener('error', fb, {once: true});
  });
  document.getElementById('back').addEventListener('click', () => select(null));
  pane.querySelectorAll('.routes button').forEach(b => b.addEventListener('click', () => { state.rute = +b.dataset.r; renderDetail(d); drawRoute(d, state.rute); layoutPills(); renderList(); }));
  pane.querySelectorAll('.legs li').forEach(li => li.addEventListener('click', () => {
    const l = d.ruter[state.rute].legs[+li.dataset.leg];
    const pts = l.type === 'buss' ? (l.trase || [l.a, l.b]) : (l.type === 'fly' ? arc(l.a, l.b) : [l.a, l.b]);
    map.flyToBounds(L.latLngBounds(pts), {padding: [70, 70], maxZoom: l.type === 'fly' ? 7 : 11, duration: .8});
    if (window.innerWidth <= 860) window.scrollTo({top: 0, behavior: 'smooth'});
  }));
  const whole = document.getElementById('whole'); if (whole) whole.addEventListener('click', e => { e.preventDefault(); drawRoute(d, state.rute); });
}
function tagCls(t) { t = (t || '').toLowerCase(); return t.startsWith('bekreftet') ? 't-ok' : (t.startsWith('estimat') || t.includes('%') ? 't-est' : 't-quote'); }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---------------- tilstand ---------------- */
function select(id) {
  if (id && state.sel === id) { /* allerede valgt: hold */ }
  state.sel = id; state.rute = 0;
  const d = D.find(x => x.id === id) || null;
  if (d && state.from !== 'alle') { const i = d.ruter.findIndex(r => r.fra === state.from); if (i >= 0) state.rute = i; }
  document.getElementById('pane-list').classList.toggle('hidden', !!d);
  document.getElementById('pane-detail').classList.toggle('hidden', !d);
  renderDetail(d); renderList(); layoutPills();
  if (d) drawRoute(d, state.rute); else { drawRoute(null); homeView(); }
  history.replaceState(null, '', d ? '#' + d.id : location.pathname + location.search);
  if (window.innerWidth <= 860 && d) window.scrollTo({top: 0, behavior: 'smooth'});
}
function hover(id, on) {
  state.hot = on ? id : null;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('hot', on && c.dataset.id === id));
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('hot', on && p.dataset.id === id));
}
document.getElementById('seg-price').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.price = b.dataset.v; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); renderList(); layoutPills(); });
document.getElementById('seg-from').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.from = b.dataset.v; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  if (state.sel) { const d = D.find(x => x.id === state.sel); if (d && state.from !== 'alle' && !d.ruter.some(r => r.fra === state.from)) { select(null); return; } if (d) { const i = d.ruter.findIndex(r => r.fra === state.from); state.rute = i >= 0 ? i : 0; renderDetail(d); drawRoute(d, state.rute); } }
  renderList(); layoutPills(); if (!state.sel) homeView(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; renderList(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sel) select(null); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && D.some(d => d.id === id) && id !== state.sel) select(id); });

renderAbout(); renderList(); homeView(); layoutPills();
const start = location.hash.slice(1);
if (start && D.some(d => d.id === start)) select(start);
setTimeout(() => { map.invalidateSize(); if (state.sel) drawRoute(D.find(x => x.id === state.sel), state.rute); else homeView(); layoutPills(); }, 300);
})();
</script>
