ck;color:var(--muted);font-size:13px}\n\n  /* ---------- Budsjett ---------- */\n  table{width:100%;border-collapse:collapse;font-size:14px}\n  th{text-align:left;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:0 0 10px;border-bottom:1px solid var(--ink)}\n  td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}\n  td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}\n  tr.sum td{border-top:1px solid var(--ink);border-bottom:0;font-weight:800;font-size:16px;padding-top:14px}\n  .tag{font-size:11px;padding:2px 7px;border-radius:2px;white-space:nowrap}\n  .t-est{background:#F4E7C6;color:var(--wait)}\n  .t-quote{background:#E6E2DA;color:var(--muted)}\n  .t-ok{background:#DDEBE1;color:#2F6B4F}\n  .basis{display:block;font-size:12.5px;color:var(--muted)}\n\n  .headline-num{\n    display:flex;flex-wrap:wrap;gap:34px;margin-top:26px;padding-top:22px;border-top:2px solid var(--deep);\n  }\n  .headline-num div b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}\n  .headline-num div small{font-size:13px;color:var(--muted)}\n\n  ul.plain{margin:0;padding-left:19px}\n  ul.plain li{margin-bottom:7px;max-width:68ch}\n  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px}\n  .warn{background:#FDF3E3;border-left:4px solid var(--amber);padding:16px 18px;margin-top:8px}\n  footer{padding:26px 44px 40px;font-size:12.5px;color:var(--muted)}\n\n  @media (max-width:700px){\n    .hero,section,footer{padding-left:22px;padding-right:22px}\n    .heroband{margin-left:-22px;margin-right:-22px}\n    .heroband div{padding-left:22px;padding-right:22px;flex-basis:50%}\n    .two{grid-template-columns:1fr;gap:22px}\n  }\n  @media print{\n    body{font-size:10px;line-height:1.4}\n    .hero{padding:18px 26px 0}\n    .hero h1{font-size:40px}\n    .promise{font-size:14px;margin-top:12px}\n    .heroband{margin:16px -26px 0}\n    .heroband div{padding:9px 26px 10px}\n    .heroband b{font-size:16px}\n    .gallery img{height:120px}\n    section{padding:14px 26px;break-inside:avoid}\n    h3{font-size:17px;margin-bottom:6px}\n    h2{margin-bottom:9px}\n    p{margin-bottom:7px}\n    ol.days li{padding:6px 0}\n    td{padding:6px 0}\n    .headline-num{margin-top:14px;padding-top:12px;gap:24px}\n    .headline-num div b{font-size:24px}\n    footer{padding:14px 26px 18px}\n    @page{size:A4;margin:8mm}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"sheet\">\n\n  <div class=\"hero\">\n    <p class=\"kicker\">Klassetur 10. trinn · Kautokeino skole · juni 2027<\/p>\n    <h1>Gdańsk<span>og Sopot, ved Østersjøen<\/span><\/h1>\n    <p class=\"promise\">Byen der den kalde krigen begynte å slutte. Verftsarbeidere og ungdommer i tjueårene veltet et system — og alt sammen står der fortsatt, tolv minutter med trikk fra stranda.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>2 fly<\/b><small>begge med Finnair<\/small><\/div>\n      <div><b>~363 800<\/b><small>kroner totalt, estimat<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Gdansk_at_night.jpg?width=1400\" alt=\"Motława og gamlebyen i Gdańsk om kvelden\"><figcaption>Motława og gamlebyen<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/PL_GD_Gdansk_crane.jpg?width=800\" alt=\"Krantoren Żuraw ved Motława\"><figcaption>Krantoren, bygget 1440<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Mot%C5%82awa_Gda%C5%84sk.jpg?width=800\" alt=\"Kaia langs Motława\"><figcaption>Kaia i Długie Pobrzeże<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\">\n      <div class=\"leg\"><b>Kautokeino → Kittilä<\/b><small>Buss · ca. 3 t 30 min<\/small><\/div>\n      <div class=\"leg\"><b>Kittilä → Helsingfors<\/b><small>Finnair · ca. 1 t 40 min<\/small><\/div>\n      <div class=\"leg\"><b>Helsingfors → Gdańsk<\/b><small>Finnair, direkte · ca. 1 t 40 min<\/small><\/div>\n    <\/div>\n    <p style=\"margin-top:16px\">Én reisedag hver vei, og ett flyselskap hele veien. Blir det forsinkelse i Helsingfors, er det Finnair som må skaffe ny plass til hele gruppen — ikke dere.<\/p>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Sopot<\/b><span class=\"basis\">Badebyen med Europas lengste trebrygge, 511 meter ut i Østersjøen. Tjue minutter med lokaltog.<\/span><\/li><li><b>Westerplatte<\/b><span class=\"basis\">Der andre verdenskrig startet 1. september 1939. Båt fra Gdańsk sentrum.<\/span><\/li><li><b>Malbork<\/b><span class=\"basis\">Verdens største teglslott, bygd av Den tyske orden. En time med tog, står på verdensarvlisten.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Én aktivitet hver dag, alt innenfor trikkeavstand<\/h3>\n    <ol class=\"days\">\n      <li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, innsjekk og kveldsmat<\/small><\/div><span class=\"act\">—<\/span><\/li>\n      <li><div class=\"day\"><b>Solidaritetssenteret ECS<\/b><small>Der streiken i 1980 startet. Gamlebyen og Długi Targ etterpå<\/small><\/div><span class=\"act\">110 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Museet for 2. verdenskrig og Westerplatte<\/b><small>Båt ut til halvøya der krigen begynte<\/small><\/div><span class=\"act\">85 + 220 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Sopot<\/b><small>Molo, strandpromenade og Aquapark hvis sjøen er for kald<\/small><\/div><span class=\"act\">150 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Malbork<\/b><small>Europas største teglborg. Dagstur med leiebuss<\/small><\/div><span class=\"act\">250 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Gdynia<\/b><small>Emigrasjonsmuseet, jageren Błyskawica, seilskipet Dar Pomorza<\/small><\/div><span class=\"act\">85 kr<\/span><\/li>\n      <li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li>\n      <li><div class=\"day\"><b>Hjemreise<\/b><small>Gdańsk – Helsingfors – Kittilä – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li>\n    <\/ol>\n    <p style=\"margin-top:16px;font-size:13px;color:var(--muted)\">Prisene er veiledende listepriser per person. Skolegrupper får normalt redusert billett, og enkelte museer har gratis inngang én dag i uka. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <h3>Må bookes direkte — 28 plasser i juni forsvinner fort<\/h3>\n    <p class=\"lede\">Ingen av disse er reservert. De er valgt fordi de har nok flersengsrom til en gruppe på 28 og ligger i gangavstand til gamlebyen. Ring, ikke book på nett — gruppepris og samlet plassering får dere bare over telefon.<\/p>\n    <table style=\"margin-top:18px\">\n      <tr><td><b>World Hostel<\/b><span class=\"basis\">Brygidki 14, Gdańsk · +48 504 973 953 · best vurdert av alternativene, frokost inkludert<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n      <tr><td><b>Moon Hostel<\/b><span class=\"basis\">Długie Ogrody 6A, Gdańsk · +48 500 331 110 · sentralt, egne rom med bad<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n      <tr><td><b>3 City-Hostel<\/b><span class=\"basis\">Targ Drzewny 12/14, Gdańsk · +48 58 354 54 54 · størst kapasitet, men svakest vurderinger<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Kittilä t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">26 200<\/td><\/tr>\n      <tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 400 · Helsingfors–Gdańsk priset til 1 585, Kittilä–Helsingfors anslått til 2 800<\/span><\/td><td class=\"num\">123 200<\/td><\/tr>\n      <tr><td>Overnatting, 7 netter<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 7 × 380 · flersengsrom med frokost<\/span><\/td><td class=\"num\">74 500<\/td><\/tr>\n      <tr><td>Mat, lunsj og middag<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 7 × 300<\/span><\/td><td class=\"num\">58 800<\/td><\/tr>\n      <tr><td>Lokaltransport og transfer<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">Trikk og tog i trebyen, buss t/r flyplass<\/span><\/td><td class=\"num\">10 000<\/td><\/tr>\n      <tr><td>Inngang og utflukter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">Én aktivitet per dag, se programmet<\/span><\/td><td class=\"num\">30 000<\/td><\/tr>\n      <tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × ca. 290<\/span><\/td><td class=\"num\">8 000<\/td><\/tr>\n      <tr><td>Buffer<\/td><td><span class=\"tag t-est\">10 %<\/span><span class=\"basis\">Valutasving, prisøkning, uforutsett<\/span><\/td><td class=\"num\">33 100<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">363 800<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>13 000<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 8<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Bare bussen er bekreftet.<\/b> Flyprisen er den store usikkerheten, og den er også den største posten. Finnair tar ikke imot bestilling på 28 personer over nett — se listen nederst.\n    <\/div>\n  <\/section>\n\n\n\n  <footer>\n    Ikke inkludert: lommepenger, pass eller nasjonalt ID-kort, avbestillingsforsikring, egenandel ved sykdom.<br>\n    Valutakurs brukt i beregningen: 1 EUR = 11,80 kr · 1 PLN = 2,75 kr. Alle tall utenom bussen er estimater til tilbudene foreligger.<br>\n    Bilder fra Wikimedia Commons under CC BY-SA: «Gdansk at night» av 22Kartika · «PL GD Gdansk crane» av Andrei Stroe · «Motława Gdańsk».\n  <\/footer>\n\n<\/div>\n<\/body>\n<\/html>\n"},{"id":"italia","fil":"Klassetur-Italia.html","navn":"Italia","under":"Lido di Jesolo, med Venezia","kicker":"Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027","promise":"Femten kilometer sandstrand, Venezia førti minutter unna med båt, og et strandvillage med helpensjon. Maten er dekket sju dager i uka.","region":"adr","regionNavn":"Adriaterhavet og Svartehavet","farge":"#A85434","land":"Italia","pass":false,"passTekst":null,"base":{"navn":"Lido di Jesolo","lat":45.4972,"lng":12.6403,"beskrivelse":"Lido di Jesolo, dagstur til Venezia","maps":"https://www.google.com/maps/search/?api=1&query=Lido+di+Jesolo%2C+Italia"},"pp":13200,"total":369520,"ruter":[{"via":"Alta, Oslo, Venezia","pp":13200,"total":369520,"legs":[{"type":"buss","fra":"Kautokeino","til":"Alta","info":"Buss · ca. 2 t","a":[69.0117,23.0417],"b":[69.9761,23.3717],"trase":[[69.0117,23.0417],[69.125,23.03],[69.26,23.25],[69.43,23.66],[69.56,23.63],[69.71,23.57],[69.83,23.43],[69.95,23.3],[69.9761,23.3717]]},{"type":"fly","fra":"Alta","til":"Oslo","info":"Norwegian eller SAS · ca. 2 t","a":[69.9761,23.3717],"b":[60.1976,11.1004],"fraKode":"ALF","tilKode":"OSL"},{"type":"fly","fra":"Oslo","til":"Venezia","info":"Norwegian, direkte to dager i uka · ca. 2 t 40 min","a":[60.1976,11.1004],"b":[45.5053,12.3519],"fraKode":"OSL","tilKode":"VCE"},{"type":"transfer","fra":"Venezia","til":"Lido di Jesolo","info":"Buss · ca. 50 min (anslag)","a":[ nal Grande i Venezia<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Venezia<\/b><small>Norwegian, direkte to dager i uka · ca. 2 t 40 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Venezia, 40 minutter med båt<\/b><span class=\"basis\">Markusplassen, Rialto og Dogepalasset. Buss til Punta Sabbioni og båt derfra — ingen bil trengs.<\/span><\/li><li><b>Caribe Bay<\/b><span class=\"basis\">Vannpark i Jesolo med karibisk tema, kåret til Italias beste flere år på rad. I gangavstand fra strandhotellene.<\/span><\/li><li><b>Verona og Padova<\/b><span class=\"basis\">Det romerske amfiteateret i Verona og universitetsbyen Padova, begge under to timer med tog fra San Donà.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strand, vannpark og Venezia<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, ATVO-buss fra flyplassen på ca. 50 minutter, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Stranda<\/b><small>Bading og strandliv rett utenfor villagen, badevakt på stranda<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Venezia<\/b><small>Buss og båt via Punta Sabbioni, Markusplassen, Rialto og Dogepalasset<\/small><\/div><span class=\"act\">490 kr<\/span><\/li><li><div class=\"day\"><b>Caribe Bay<\/b><small>Vannparken i Jesolo, gruppepris fra 20 personer<\/small><\/div><span class=\"act\">470 kr<\/span><\/li><li><div class=\"day\"><b>Verona<\/b><small>Tog fra San Donà, arenaen og gamlebyen<\/small><\/div><span class=\"act\">330 kr<\/span><\/li><li><div class=\"day\"><b>Padova<\/b><small>Universitetsbyen og Prato della Valle, tog<\/small><\/div><span class=\"act\">210 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Venezia – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Villaggio Marzotto ligger rett på stranda, har over 430 rom og helpensjon i selvbetjent restaurant — prislista for 2026 gir 448 euro per person for uka i perioden 30. mai til 13. juni.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Villaggio al Mare Marzotto<\/b><span class=\"basis\">Viale Oriente 44, Lido di Jesolo · +39 0421 961068 · rom med to til fire senger, helpensjon, egen strand og basseng<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Hotel American<\/b><span class=\"basis\">Via dei Mille 39, Lido di Jesolo · +39 0421 971887 · egen gruppeavdeling, drikke inkludert til måltidene, ordner båt til Venezia<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 600 · Alta–Oslo anslått til 2 500, Oslo–Venezia til 2 100<\/span><\/td><td class=\"num\">128 800<\/td><\/ te samling jugendarkitektur, en badeby med togforbindelse på 25 minutter, og en gammel sovjetisk bobbane de faktisk får kjøre.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>13 200<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>370 320<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Riga_(33844464828).jpg?width=1400\" alt=\"Gamlebyen i Riga\"><figcaption>Gamlebyen i Riga<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Riga_Panorama.jpg?width=1400\" alt=\"Utsikt over Riga og Daugava\"><figcaption>Utsikt over Riga og Daugava<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Kittilä<\/b><small>Buss · ca. 3 t 30 min<\/small><\/div><div class=\"leg\"><b>Kittilä → Helsingfors<\/b><small>Finnair · ca. 1 t 40 min<\/small><\/div><div class=\"leg\"><b>Helsingfors → Riga<\/b><small>Finnair eller airBaltic, direkte · ca. 1 t<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Jūrmala<\/b><span class=\"basis\">Sandstrand og trevillaer langs Østersjøen, en halvtime med tog fra sentrum.<\/span><\/li><li><b>Sigulda og Gauja<\/b><span class=\"basis\">Nasjonalpark med tre borger, bobsleigh-bane fra Sovjet-tida, taubane over dalen og Baltikums største grotte. En time unna.<\/span><\/li><li><b>Sentralmarkedet<\/b><span class=\"basis\">Fem zeppelinerhangarer fra 1930-tallet gjort om til Europas største marked, rett ved togstasjonen.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>By, strand og bobbane<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, nt-size:38px}\n    .promise{font-size:13px;margin-top:10px}\n    .heroband{margin:14px -26px 0} .heroband div{padding:8px 26px 9px} .heroband b{font-size:15px}\n    .gallery img{height:120px}\n    section{padding:12px 26px;break-inside:avoid} h3{font-size:16px;margin-bottom:5px}\n    h2{margin-bottom:8px} p{margin-bottom:6px} ol.days li{padding:5px 0} td{padding:5px 0}\n    .headline-num{margin-top:12px;padding-top:10px;gap:22px} .headline-num div b{font-size:22px}\n    footer{padding:12px 26px 16px}\n    @page{size:A4;margin:8mm}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"sheet\">\n  <div class=\"hero\">\n    <p class=\"kicker\">Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027<\/p>\n    <h1>Slovenia<span>Bled, ved Julian-alpene<\/span><\/h1>\n    <p class=\"promise\">Innsjø med en øy og et slott på en klippe, juvet Vintgar på plankesti over elva, og Ljubljana en time unna. Fjell på alle kanter.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>13 200<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>370 320<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Bled_Island_05.jpg?width=1400\" alt=\"Bled-øya i innsjøen\"><figcaption>Bled-øya i innsjøen<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Blejski_Vintgar_01.jpg?width=1400\" alt=\"Plankestien gjennom Vintgar\"><figcaption>Plankestien gjennom Vintgar<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Kittilä<\/b><small>Buss · ca. 3 t 30 min<\/small><\/div><div class=\"leg\"><b>Kittilä → Helsingfors<\/b><small>Finnair · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Helsingfors → Ljubljana<\/b><small>Finnair, direkte tre dager i uka · ca. 2 t 40 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Vintgar-juvet<\/b><span class=\"basis\">Plankesti festet i fjellveggen 1,6 kilometer gjennom en kløft, over grønt vann. Gratis skyttelbuss fra Bled.<\/span><\/li><li><b>Postojna og Predjama<\/b><span class=\"basis\">Dryppsteinsgrotte med tog inne i fjellet, og en borg bygd inn i en klippevegg like ved. Halvannen time sørover.<\/span><\/li><li><b>Bohinj og Triglav<\/b><span class=\"basis\">Slovenias største innsjø med bading, inne i nasjonalparken rundt Triglav. En halvtime fra Bled.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Innsjø, juv og fjell<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, buss fra Ljubljana lufthavn på en halvtime, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Bled og øya<\/b><small>Rundt innsjøen til fots, pletna-båt til øya og kirken med ønskeklokka<\/small><\/div><span class=\"act\">310 kr<\/span><\/li><li><div class=\"day\"><b>Slottet og Vintgar<\/b><small>Borgen 130 meter over vannet, plankesti gjennom juvet<\/small><\/div><span class=\"act\">270 kr<\/span><\/li><li><div class=\"day\"><b>Postojna<\/b><small>Dryppsteinsgrotta med tog inne i fjellet, buss tur/retur<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Rafting på Sava<\/b><small>Tre timer med guide, våtdrakt og utstyr inkludert<\/small><\/div><span class=\"act\">590 kr<\/span><\/li><li><div class=\"day\"><b>Ljubljana<\/b><small>Hovedstaden på dagstur, buss en time hver vei<\/small><\/div><span class=\"act\">150 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Bading i Bohinj, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Ljubljana – Helsingfors – Kittilä – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Bledec ligger under slottet og tar hele klasser — 55 senger i rom med tre til seks køyer, med egen bussparkering. Turistskatt på rundt 3 euro per person per natt kommer i tillegg.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Youth Hostel Bledec<\/b><span class=\"basis\">Grajska cesta 17, Bled · +386 4 574 52 50 · 55 senger i 3–6-sengsrom med bad, frokost, halv- og helpensjon kan bestilles<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Bled Hostel<\/b><span class=\"basis\">Grajska cesta 22, Bled · +386 31 523 056 · 60 senger i flersengsrom, frokost må bestilles dagen før<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Kittilä t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">26 200<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 600 · Kittilä–Helsingfors anslått til 2 000, Helsingfors–Ljubljana til 2 600<\/span><\/td><td class=\"num\">128 800<\/td><\/tr><tr><td>Overnatting, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 3 400 · flersengsrom med frokost, turistskatt inkludert<\/span><\/td><td class=\"num\">95 200<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 2 200 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">61 600<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 1 800 · én per dag, se programmet<\/span><\/td><td class=\"num\">50 400<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">370 320<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>13 200<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 6<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke slått opp.<\/b> Sommerprogrammet for 2027 er ikke publisert ennå. Beløpet bygger på 2 000 kroner for Kittilä–Helsingfors og 2 600 for Helsingfors–Ljubljana. Finnair flyr Helsingfors–Ljubljana tre dager i uka (mandag, onsdag og fredag i 2026), så avreisedagen må passe med flyplanen. Vintgar oppgis til både 10 og 15 euro på ulike sider. Kurs brukt: 1 EUR = 11,80 kr.\n    <\/div>\n  <\/section>\n\n  <footer>\n    Ikke inkludert: lommepenger, pass eller nasjonalt ID-kort, avbestillingsforsikring, egenandel ved sykdom.<br>\n    Bilder fra Wikimedia Commons: «Bled Island 05» av Krzysztof Golik (CC BY-SA 4.0) · «Blejski Vintgar 01» av Smihael (CC BY-SA 3.0).<br>\n    Alle beløp i kroner, avrundet. Modellen er frokost på hostellet og felles middag på restaurant, ikke all inclusive. Beløpene er uten buffer.\n  <\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},{"id":"vilnius","fil":"Klassetur-Vilnius.html","navn":"Vilnius","under":"med Trakai og Grūtas","kicker":"Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027","promise":"Byen der HBO filmet Chernobyl, med en vannborg fra 1400-tallet en halvtime unna og en park full av veltede Lenin-statuer. Billigst i Europa.","regi otalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Vilnius_old_town_1.JPG?width=1400\" alt=\"St. Annes kirke i gamlebyen\"><figcaption>St. Annes kirke i gamlebyen<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Vilnius_-_Panorama_02.jpg?width=1400\" alt=\"Gamlebyen sett fra åsen\"><figcaption>Gamlebyen sett fra åsen<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Kittilä<\/b><small>Buss · ca. 3 t 30 min<\/small><\/div><div class=\"leg\"><b>Kittilä → Helsingfors<\/b><small>Finnair · ca. 1 t 40 min<\/small><\/div><div class=\"leg\"><b>Helsingfors → Vilnius<\/b><small>Finnair, direkte · ca. 1 t 20 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Trakai<\/b><span class=\"basis\">Rød teglborg på en øy i en innsjø, 30 minutter vestover. Kan padles rundt.<\/span><\/li><li><b>Grūtas Park<\/b><span class=\"basis\">Sovjetstatuene fra hele Litauen samlet i en skog, med rekonstruert leir. Halvannen time sørover.<\/span><\/li><li><b>Užupis<\/b><span class=\"basis\">Bydelen som erklærte seg selvstendig republikk i 1997, med egen grunnlov spikret opp på veggen på 23 språk. Over elva fra gamlebyen.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Filmkulisser, borg og statuepark<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, innsjekk og felles middag<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Gamlebyen i Vilnius<\/b><small>Katedralplassen, Gediminas-tårnet og bydelen Užupis<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Fabijoniškės<\/b><small>Drabantbyen der HBO filmet Pripjat i serien Chernobyl<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Trakai<\/b><small>Vannborgen fra 1400-tallet, båt og bading i innsjøen<\/small><\/div><span class=\"act\">110 kr<\/span><\/li><li><div class=\"day\"><b>Grūtas-parken<\/b><small>Sovjetstatuene som ble tatt ned i 1991, samlet på ett sted<\/small><\/div><span class=\"act\">120 kr<\/span><\/li><li><div class=\"day\"><b>Vichy vannpark<\/b><small>Vannpark i utkanten av byen<\/small><\/div><span class=\"act\">280 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Shopping, park, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Vilnius – Helsingfors – Kittilä – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Vilnius har det laveste prisnivået av alle kandidatene i EU, og gamlebyen er kompakt nok til at gruppen holder seg samlet.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Old Town Trio Hotel<\/b><span class=\"basis\">Raugyklos g. 15A · +370 5 216 1696 · i kanten av gamlebyen, frokost inkludert<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Vilnius City Hotel<\/b><span class=\"basis\">Švitrigailos g. 11D · +370 689 87777 · stor kapasitet, nær buss- og togstasjonen<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Kittilä t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">26 200<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 600 · Kittilä–Helsingfors anslått til 2 800, Helsingfors–Vilnius til 1 800<\/span><\/td><td class=\"num\">128 800<\/td><\/tr><tr><td>Hotell, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 200<\/span><\/td><td class=\"num\">117 600<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 2 000 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">56 000<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 1 200 · én per dag, se programmet<\/span><\/td><td class=\"num\">33 600<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">370 320<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>13 200<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 6<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke slått opp.<\/b> Sommerprogrammet for 2027 er ikke publisert ennå. Beløpet bygger på 2 800 kroner for Kittilä–Helsingfors og resten videre fra Helsingfors.\n    <\/div>\n  <\/section>\n\n  <footer>\n    Ikke inkludert: lommepenger, pass eller nasjonalt ID-kort, avbestillingsforsikring, egenandel ved sykdom.<br>\n    Bilder fra Wikimedia Commons: «Vilnius old town 1» av Karmen media (CC BY-SA 3.0) · «Vilnius - Panorama 02» av Lestat (Jan Mehlich) (CC BY-SA 3.0).<br>\n    Alle beløp i kroner, avrundet. Modellen er frokost på hotellet og felles middag på restaurant, ikke all inclusive. Beløpene er uten buffer.\n  <\/footer>\n<\/div>\n<\/ eter sandstrand.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>14 100<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>394 720<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Durres,Portez_beach.jpg?width=1400\" alt=\"Stranda ved Durrës\"><figcaption>Stranda ved Durrës<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Durr%C3%ABs_beach_(by_Pudelek).JPG?width=1400\" alt=\"Strandpromenaden i Durrës\"><figcaption>Strandpromenaden i Durrës<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Tirana<\/b><small>Norwegian, direkte · ca. 3 t<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Tirana<\/b><span class=\"basis\">Hovedstaden med Skanderbeg-plassen, den fargede fasadebyen og Bunkart — en atombunker fra Hoxha-tida gjort om til museum. 40 minutter unna.<\/span><\/li><li><b>Krujë<\/b><span class=\"basis\">Festningsbyen i fjellsiden med basar fra osmansk tid, en time fra Durrës.<\/span><\/li><li><b>Det romerske amfiteateret<\/b><span class=\"basis\">Ligger midt i Durrës, bygd på 100-tallet, tok 15 000 tilskuere. Ble funnet igjen først i 1966.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strand, romersk historie og lave priser<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer på 40 minutter, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Sandstranda sørover fra byen<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Durrës<\/b><small>Amfiteateret fra 100-tallet, mosaikkene og havnepromenaden<\/small><\/div><span class=\"act\">60 kr<\/span><\/li><li><div class=\"day\"><b>Tirana<\/b><small>Skanderbeg-plassen, Bunk'Art i atombunkeren fra Hoxha-tiden<\/small><\/div><span class=\"act\">120 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Kajakk, SUP og bananbåt fra stranda<\/small><\/div><span class=\"act\">230 kr<\/span><\/li><li><div class=\"day\"><b>Kruja<\/b><small>Basaren og borgen oppe i fjellsiden<\/small><\/div><span class=\"act\">150 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Tirana – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Durrës er valgt framfor Sarandë og Ksamil fordi transferen fra Tirana er 40 minutter i stedet for tre og en halv time. Prisnivået er det laveste av alle kandidatene.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>White Hill Hotel<\/b><span class=\"basis\">Rruga Taulantia, Currila, Durrës · +355 69 313 6666 · basseng, sjøutsikt, frokost inkludert<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Hotel Villa Pascucci Mare<\/b><span class=\"basis\">Rruga Taulantia, Durrës · +355 69 708 6500 · ved strandpromenaden<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 5 100 · Alta–Oslo anslått til 2 500, Oslo–Tirana til 2 600<\/span><\/td><td class=\"num\">142 800<\/td><\/tr><tr><td>Hotell, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 500<\/span><\/td><td class=\"num\">126 000<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 2 400 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">67 200<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 1 200 · én per dag, se programmet<\/span><\/td><td class=\"num\">33 600<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">394 720<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>14 100<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 6<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke slått opp.<\/b> Sommerprogrammet for 2027 er ikke publisert ennå. Beløpet bygger på 2 500 kroner for Alta–Oslo og resten videre fra Oslo.\n    <\/div>\n  <\/section>\n\n  <footer>\n    Ikke inkludert: lommepenger, pass for alle 28 — nasjonalt ID-kort er ikke nok, avbestillingsforsikring, egenandel ved sykdom.<br>\n    Bilder fra Wikimedia Commons: «Durres,Portez beach» av Durr lgaria<span>Nesebar ved Svartehavet<\/span><\/h1>\n    <p class=\"promise\">En gammel by på en halvøy, oppført på verdensarvlisten, med sandstrand på begge sider. EU-land, så ID-kort og helsetrygdkort holder.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>14 300<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>400 320<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Panorama_Nesebar.jpg?width=1400\" alt=\"Gamlebyen i Nesebar, på halvøya\"><figcaption>Gamlebyen i Nesebar, på halvøya<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Nesebar-panorama-night.JPG?width=1400\" alt=\"Nesebar om kvelden\"><figcaption>Nesebar om kvelden<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Burgas<\/b><small>Charter, faste ukedager · ca. 3 t 15 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Nesebar gamleby<\/b><span class=\"basis\">Halvøy med 40 kirker fra bysantinsk tid, forbundet med land av en smal tange. Verdensarv, og hotellet ligger like ved.<\/span><\/li><li><b>Sozopol og Ropotamo<\/b><span class=\"basis\">Trehusby fra 1800-tallet lenger sør, og elvesafari i naturreservatet Ropotamo.<\/span><\/li><li><b>Aquapark og Action Aquapark<\/b><span class=\"basis\">To store badeland i Nesebar-området, begge i gangavstand eller kort busstur fra hotellene.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Verdensarv på den ene siden, strand på den andre<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer på 40 minutter, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Sørstranda og promenaden<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Gamlebyen i Nesebar<\/b><small>Trehusene og kirkene på halvøya, verdensarv siden 1983<\/small><\/div><span class=\"act\">60 kr<\/span><\/li><li><div class=\"day\"><b>Aqua Paradise<\/b><small>Vannpark like utenfor byen<\/small><\/div><span class=\"act\">330 kr<\/span><\/li><li><div class=\"day\"><b>Sozopol<\/b><small>Rolig kystby en time sørover, gamleby og strand<\/small><\/div><span class=\"act\">120 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Kajakk, SUP og bananbåt<\/small><\/div><span class=\"act\">230 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Burgas – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Nesebar er valgt framfor Sunny Beach, som ligger rett nord for byen og er Bulgarias største utelivsdestinasjon. Avstanden er ti minutter, så tilbudet finnes uten at gruppen bor midt i det.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Sol Nessebar Bay<\/b><span class=\"basis\">kv. Aurelia 7, Nesebar · +359 55 421 110 · stort anlegg med vannpark og egen strand<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Afrodita Beach Hotel<\/b><span class=\"basis\">Perla 17, Nesebar · +359 89 221 3537 · ved sjøen, høyt vurdert, frokost inkludert<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 5 300 · Alta–Oslo anslått til 2 500, Oslo–Burgas til 2 800<\/span><\/td><td class=\"num\">148 400<\/td><\/tr><tr><td>Hotell, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 500<\/span><\/td><td class=\"num\">126 000<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 2 400 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">67 200<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 1 200 · én per dag, se programmet<\/span><\/td><td class=\"num\">33 600<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">400 320<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>14 300<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 6<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke slått opp.<\/b> Sommerprogrammet for 2027 er ikke publisert ennå. Beløpet bygger på 2 500 kroner for Alta–Oslo og resten videre fra Oslo.\n    <\/div>\n /head>\n<body>\n<div class=\"sheet\">\n  <div class=\"hero\">\n    <p class=\"kicker\">Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027<\/p>\n    <h1>Tyrkia<span>Side ved Antalya<\/span><\/h1>\n    <p class=\"promise\">Et gresk-romersk tempel som står rett ned i vannet, basar i gatene bak, og lange sandstrender i begge retninger. Mest for pengene av alle kandidatene.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>14 500<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>405 920<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Sunrise_apollo_side.jpg?width=1400\" alt=\"Apollontempelet i Side\"><figcaption>Apollontempelet i Side<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Side_Turkey_beach_(122502321).jpg?width=1400\" alt=\"Stranda i Side\"><figcaption>Stranda i Side<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Antalya<\/b><small>Norwegian, direkte · ca. 4 t 20 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Sides antikke by<\/b><span class=\"basis\">Apollontempelet står rett i vannkanten, og amfiteateret tar 15 000. Ligger i gamlebyen, gratis å gå rundt i.<\/span><\/li><li><b>Manavgat-fossen og elva<\/b><span class=\"basis\">Bred foss 15 minutter unna, med båtturer på elva ned til sjøen.<\/span><\/li><li><b>Land of Legends<\/b><span class=\"basis\">Fornøyelses- og vannpark i Belek, en halvtime unna — den største i Tyrkia.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strand, ruiner og elvedal<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer på en time, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Sandstranda vest for gamlebyen<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Gamlebyen i Side<\/b><small>Apollontempelet ved havet, amfiteateret og basaren<\/small><\/div><span class=\"act\">120 kr<\/span><\/li><li><div class=\"day\"><b>Rafting i Köprülü-kløfta<\/b><small>Elverafting med guide, buss tur/retur<\/small><\/div><span class=\"act\">470 kr<\/span><\/li><li><div class=\"day\"><b>Vannpark<\/b><small>Land of Legends eller Aqua Land, buss tur/retur<\/small><\/div><span class=\"act\">470 kr<\/span><\/li><li><div class=\"day\"><b>Manavgat<\/b><small>Fossen og markedet, båttur på elva<\/small><\/div><span class=\"act\">180 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Antalya – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Side og Sorgun er valgt framfor Alanya sentrum. Prisnivået gjør at hotellstandarden blir høyere her enn for samme penger i Spania.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Berry Blue Hotel<\/b><span class=\"basis\">Sorgun, Titreyengöl, Manavgat · +90 242 756 95 85 · egen strand, flere basseng, buss til Side utenfor<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><t kadarsjøen<\/b><span class=\"basis\">Balkans største innsjø, nasjonalpark med båtturer mellom flytende øyer av vannliljer. En time innover i landet.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strand, gamleby og fjord<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer på 25 minutter, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Bečići-stranda og promenaden mot Budva<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Budva gamleby<\/b><small>Bymurene, sitadellet og Sveti Stefan sørover<\/small><\/div><span class=\"act\">60 kr<\/span><\/li><li><div class=\"day\"><b>Kotorbukta<\/b><small>Gamlebyen i Kotor og trappene opp til festningen<\/small><\/div><span class=\"act\">180 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Kajakk og SUP langs kysten<\/small><\/div><span class=\"act\">230 kr<\/span><\/li><li><div class=\"day\"><b>Skadarsjøen<\/b><small>Båttur på Balkans største innsjø, nasjonalpark<\/small><\/div><span class=\"act\">300 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Tivat – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Bečići er valgt framfor Budva sentrum, der utelivet ligger. Avstanden er tjue minutter langs promenaden. Hotellkapasiteten i juni er knapp, så dette bør bookes først.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Hotellene langs Bečići-stranda<\/b><span class=\"basis\">Beč ure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/City_of_Edinburgh_-_Edinburgh_Castle_-_20140421004403.jpg?width=1400\" alt=\"Edinburgh Castle\"><figcaption>Edinburgh Castle<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Edinburgh<\/b><small>Norwegian, direkte · ca. 1 t 50 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Arthurs Seat<\/b><span class=\"basis\">Utdødd vulkan 251 meter over byen, midt i Holyrood Park. Gratis, tar en time opp.<\/span><\/li><li><b>Portobello<\/b><span class=\"basis\">Byens strand med promenade og badehus, 20 minutter med buss fra sentrum.<\/span><\/li><li><b>Highlands og Loch Ness<\/b><span class=\"basis\">Glencoe, Loch Ness og Ben Nevis på dagstur med buss — hele veien nordvestover og tilbake på tolv timer.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Slott, fjell og Highlands<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, trikk fra flyplassen, innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Gamlebyen og Arthur's Seat<\/b><small>Royal Mile, opp på Arthur's Seat, gratis<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Edinburgh Castle og National Museum<\/b><small>Slottet, museet er gratis<\/small><\/div><span class=\"act\">250 kr<\/span><\/li><li><div class=\"day\"><b>Highlands<\/b><small>Dagstur med buss til Glencoe og Loch Ness<\/small><\/div><span class=\"act\">750 kr<\/span><\/li><li><div class=\"day\"><b>Dynamic Earth og Camera Obscura<\/b><small>Vitensenter under Arthur's Seat, illusjoner ved slottet<\/small><\/div><span class=\"act\">550 kr<\/span><\/li><li><div class=\"day\"><b>Portobello og Britannia<\/b><small>Stranda i byen, det kongelige skipet i Leith<\/small><\/div><span class=\"act\">270 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Shopping, park, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Edinburgh – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Cowgate-alternativet er valgt bort — det er utelivsgata i gamlebyen. Storbritannia er utenfor EU: pass for alle 28 og digital innreisetillatelse (ETA) på forhånd.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Edinburgh Central Youth Hostel<\/b><span class=\"basis\">9 Haddington Place · Hostelling Scotland, gruppebestilling via nettsiden · 296 senger, flersengsrom med bad, ti minutter fra Waverley<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>MEININGER Hotel Edinburgh Haymarket<\/b><span class=\"basis\">1 Osborne Terrace, EH12 5HG · gruppebestilling via meininger-hotels.com · rom med to til seks senger, alle med bad, seks minutter fra Haymarket og trikken fra flyplassen<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span cla  Enric (CC BY-SA 4.0).<br>\n    Alle beløp i kroner, avrundet. Modellen er frokost på hostellet og felles middag på restaurant, ikke all inclusive. Beløpene er uten buffer.\n  <\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},{"id":"fjordene","fil":"Klassetur-Fjordene.html","navn":"Fjordene","under":"Preikestolen, Bergen og Sognefjorden","kicker":"Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027","promise":"Preikestolen 604 meter rett over Lysefjorden, hurtigbåt gjennom Norges lengste fjord, og Nærøyfjorden på UNESCOs verdensarvliste. Rundreise med tre baser — ingen pass, ingen valuta, og helsetjenesten er den samme som hjemme.","region":"norge","regionNavn":"Norge","farge":"#5C3D8C","land":"Vestlandet","pass":false,"passTekst":null,"base":{"navn":"Bergen","lat":60.3913,"lng":5.3221,"beskrivelse":"Preikestolen, Bergen og Sognefjorden","maps":"https://www.google.com/maps/search/?api=1&query=Bergen%2C+Vestlandet"},"pp":15600,"total":436720,"ruter":[{"via":"Alta, Oslo, Bergen","pp":15600,"total":436720,"legs":[{"type":"buss","fra":"Kautokeino","til":"Alta","info":"Buss · ca. 2 t","a":[69.0117,23.0417],"b":[69.9761,23.3717],"trase":[[69.0117,23.0417],[69.125,23.03],[69.26,23.25],[69.43,23.66],[69.56,23.63],[69.71,23.57],[69.83,23.43],[69.95,23.3],[69.9761,23.3717]]},{"type":"fly","fra":"Alta","til":"Oslo","info":"Norwegian eller SAS · ca. 2 t","a":[69.9761,23.3717],"b":[60.1976,11.1004],"fraKode":"ALF","tilKode":"OSL"},{"type":"fly","fra":"Oslo","til":"Bergen","info":"Norwegian, SAS eller Widerøe, direkte · ca. 55 min","a":[60.1976,11.1004],"b":[60.2934,5.2181],"fraKode":"OSL","tilKode":"BGO"},{"type":"transfer","fra":"Bergen","til":"Bergen","info":"Bybanen · ca. 45 min (anslag)","a":[60.2934,5.2181],"b":[60.3913,5.3221]}],"kilde":"ark","fra":"Alta","hub":"Oslo","hubType":"fly","reisetid":{"min":340,"mangler":[],"bareTransfer":true}}],"band":[["8 dager","7 netter"],["28","22 elever, 6 voksne"],["15 600","kroner per reisende"],["436 720","kroner totalt"]],"bilder":[{" ;color:#8A6A1F} .t-quote{background:#E6E2DA;color:var(--muted)}\n  .t-ok{background:#DDEBE1;color:#2F6B4F}\n  .basis{display:block;font-size:12.5px;color:var(--muted)}\n  .headline-num{display:flex;flex-wrap:wrap;gap:30px;margin-top:22px;padding-top:18px;border-top:2px solid var(--deep)}\n  .headline-num div b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}\n  .headline-num div small{font-size:13px;color:var(--muted)}\n  .warn{background:#FBF0DD;border-left:4px solid var(--amber);padding:14px 17px;margin-top:14px}\n  footer{padding:22px 44px 34px;font-size:12.5px;color:var(--muted)}\n  @media (max-width:700px){\n    .hero,section,footer{padding-left:22px;padding-right:22px}\n    .heroband{margin-left:-22px;margin-right:-22px}\n    .heroband div{padding-left:22px;padding-right:22px;flex-basis:50%}\n  }\n  @media print{\n    body{font-size:10px;line-height:1.4}\n    .hero{padding:16px 26px 0} .hero h1{font-size:38px}\n    .promise{font-size:13px;margin-top:10px}\n    .heroband{margin:14px -26px 0} .heroband div{padding:8px 26px 9px} .heroband b{font-size:15px}\n    .gallery img{height:120px}\n    section{padding:12px 26px;break-inside:avoid} h3{font-size:16px;margin-bottom:5px}\n    h2{margin-bottom:8px} p{margin-bottom:6px} ol.days li{padding:5px 0} td{padding:5px 0}\n    .headline-num{margin-top:12px;padding-top:10px;gap:22px} .headline-num div b{font-size:22px}\n    footer{padding:12px 26px 16px}\n    @page{size:A4;margin:8mm}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"sheet\">\n  <div class=\"hero\">\n    <p class=\"kicker\">Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027<\/p>\n    <h1>Fjordene<span>Preikestolen, Bergen og Sognefjorden<\/span><\/h1>\n    <p class=\"promise\">Preikestolen 604 meter rett over Lysefjorden, hurtigbåt gjennom Norges lengste fjord, og Nærøyfjorden på UNESCOs verdensarvliste. Rundreise med tre baser — ingen pass, ingen valuta, og helsetjenesten er den samme som hjemme.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>15 600<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>436 720<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/N%C3%A6r%C3%B8yfjord_-_The_world's_most_beautiful_fjord_(32060514105).jpg?width=1400\" alt=\"Nærøyfjorden, arm av Sognefjorden\"><figcaption>Nærøyfjorden, arm av Sognefjorden<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Bergen_Bryggen_2986.jpg?width=1400\" alt=\"Bryggen i Bergen\"><figcaption>Bryggen i Bergen<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Bergen<\/b><small>Norwegian, SAS eller Widerøe, direkte · ca. 55 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Vøringsfossen og Hardangerfjorden<\/b><span class=\"basis\">182 meter fritt fall ned i Måbødalen, med sikrede stier og en trappebro over elva. Dagstur østover fra Bergen.<\/span><\/li><li><b>Trolltunga<\/b><span class=\"basis\">Klippehylla som stikker ut over Ringedalsvatnet. 20 kilometer tur/retur og 7–10 timer fra nærmeste parkering; snø kan ligge første uka i juni.<\/span><\/li><li><b>Rosendal og Folgefonna<\/b><span class=\"basis\">Hurtigbåt fra Bergen på to timer til baroniet ved foten av breen, med rundt tre og en halv time på land.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Tre baser: Bergen, Flåm og Preikestolen<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, Bybanen fra Flesland på ca. 45 minutter, innsjekk i Bergen<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Bergen<\/b><small>Bryggen og Schøtstuene, Fløibanen opp på Fløyen, Akvariet på Nordnes<\/small><\/div><span class=\"act\">470 kr<\/span><\/li><li><div class=\"day\"><b>Sognefjorden<\/b><small>Hurtigbåt Bergen–Flåm, fem og en halv time gjennom Norges lengste og dypeste fjord<\/small><\/div><span class=\"act\">650 kr<\/span><\/li><li><div class=\"day\"><b>Nærøyfjorden<\/b><small>Fjordcruise Flåm–Gudvangen på verdensarvfjorden, Flåmsbana opp til Myrdal<\/small><\/div><span class=\"act\">730 kr<\/span><\/li><li><div class=\"day\"><b>Tilbake til Bergen<\/b><small>Tog fra Myrdal via Voss, Ulriksbanen opp på 643 meter om ettermiddagen<\/small><\/div><span class=\"act\">430 kr<\/span><\/li><li><div class=\"day\"><b>Kystbussen sørover<\/b><small>Fire og en halv time langs kysten med to fergestrekninger, innsjekk ved Preikestolen<\/small><\/div><span class=\"act\">600 kr<\/span><\/li><li><div class=\"day\"><b>Preikestolen<\/b><small>Åtte kilometer tur/retur, 500 meter opp, fire timer. Klippen ligger 604 meter over Lysefjorden<\/small><\/div><span class=\"act\">500 kr<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Stavanger – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Turen har tre baser: fire netter i Bergen, én i Flåm og to ved Preikestolen. Montana tar skoleklasser fra 20 personer og oppgir 310 kroner per person per natt i flersengsrom med frokost; Preikestolen BaseCamp skriver selv at de passer for skolegrupper, men publiserer ingen pris.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>HI Bergen Hostel Montana<\/b><span class=\"basis\">Johan Blyttsvei 30, 5096 Bergen · +47 55 20 80 70 · flersengsrom med frokost, gruppevilkår fra 20 personer, gratis bussparkering<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Preikestolen BaseCamp<\/b><span class=\"basis\">Preikestolvegen 521, 4105 Jørpeland · +47 51 74 20 74 · rom med to og fire senger ved selve stien, oppgir at de er godt egnet for skolegrupper<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 200 · Alta–Oslo anslått til 2 500, Oslo–Bergen inn, Stavanger–Oslo ut til 1 700<\/span><\/td><td class=\"num\">117 600<\/td><\/tr><tr><td>Overnatting, 7 netter<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 3 900 · flersengsrom, fire netter Bergen, én Flåm, to ved Preikestolen<\/span><\/td><td class=\"num\">109 200<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 3 500 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">98 000<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 3 100 · én per dag, se programmet<\/span><\/td><td class=\"num\">86 800<\/td><\/tr><tr><td>Reiseforsikring for gruppen<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 290<\/span><\/td><td class=\"num\">8 120<\/td><\/tr>\n      <tr class=\"sum\"><td>Totalt<\/td><td><\/td><td class=\"num\">436 720<\/td><\/tr>\n    <\/table>\n    <div class=\"headline-num\">\n      <div><b>15 600<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>1 av 6<\/b><small>poster endelig bekreftet<\/small><\/div>\n    <\/div>\n    <div class=\"warn\">\n      <b>Flyprisene er ikke slått opp.<\/b> Beløpet bygger på 2 500 kroner for Alta–Oslo og 1 700 for Oslo–Bergen inn og Stavanger–Oslo ut. <b>Ingen av de norske operatørene publiserer gruppepriser<\/b> — Kystbussen, Norled, Flåmsbana, Fløibanen og bussene til Preikestolen oppgir alle bare enkeltpriser, så aktivitetsposten er regnet med barne- og ungdomspris der den finnes. Ulriksbanen er den eneste med publisert gruppepris: 10 prosent fra ti personer. Preikestolen er åtte kilometer tur/retur med 500 meters stigning — alle 28 må være i stand til det, og det finnes ingen toaletter langs stien. <b>Trollstigen og Geiranger er ikke med:<\/b> de ligger 370 kilometer nord for Bergen og krever en helt annen rute med leiebuss. Trollstigen åpnet 27. april i 2026 etter to år stengt, men datoen for 2027 er ikke kunngjort, og strekningen Langvatnet–Geiranger har åpnet så sent som 17. juni.\n    <\/div>\n  <\/section>\n\n  <footer>\n    Ikke inkludert: lommepenger, avbestillingsforsikring, egenandel ved sykdom. Pass og helsetrygdkort trengs ikke.<br>\n    Bilder fra Wikimedia Commons: «Nærøyfjord - The world's most beautiful fjord (32060514105)» av Jorge Láscar (CC BY 2.0) · «Bergen Bryggen 2986» av Anna Anichkova (CC BY-SA 3.0).<br>\n    Alle beløp i kroner, avrundet. Modellen er frokost på hostellet og felles middag på restaurant, ikke all inclusive. Beløpene er uten buffer.\n  <\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},{"id":"costablanca","fil":"Klassetur-CostaBlanca.html","navn":"Costa Blanca","under":"Albir, nabobyen til Benidorm","kicker":"Klassetur 10. trinn · Kautokeino skole · 4.–10. juni 2027","promise":"Rolig strandby med fjellene rett bak, og hele Benidorms tilbud tjue mi     <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Playa_de_l'Albir.JPG?width=1400\" alt=\"Stranda i Albir, med Serra Gelada bak\"><figcaption>Stranda i Albir, med Serra Gelada bak<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Playa_del_Rac%C3%B3_del_Albir.JPG?width=1400\" alt=\"Racó de l'Albir\"><figcaption>Racó de l'Albir<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Alicante<\/b><small>Norwegian, direkte · ca. 3 t 45 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Altea og Benidorm<\/b><span class=\"basis\">Altea er den hvite gamlebyen med kuppelkirke ti minutter unna; Benidorm har Terra Mítica og Aqualandia, tjue minutter sørover.<\/span><\/li><li><b>Algar-fossene<\/b><span class=\"basis\">Bading i naturlige kulper i en elvekløft, 20 minutter innover i landet fra Albir.<\/span><\/li><li><b>Fyret på Serra Gelada<\/b><span class=\"basis\">Kyststi fra Albir opp til fyret, 2,5 kilometer med utsikt over hele bukta. Gratis, tar en time hver vei.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Rolig base, fart når de vil ha det<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer og innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Albirs strandpromenade og fyret på Serra Gelada<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Terra Mítica<\/b><small>Fornøyelsespark i Benidorm, buss tur/retur<\/small><\/div><span class=\"act\">480 kr<\/span><\/li><li><div class=\"day\"><b>Altea<\/b><small>Hvitkalket gamleby oppe i bakken, utsikt over bukta<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Aqualandia<\/b><small>Vannpark i Benidorm<\/small><\/div><span class=\"act\">400 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Kajakk og snorkling i naturparken Serra Gelada<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Alicante – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Albir er valgt framfor Benidorm sentrum fordi utelivet der er innrettet mot aldersgruppen rett over elevenes. Avstanden er tjue minutter med buss.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Kaktus Albir<\/b><span class=\"basis\">Carrer Pau Casals 4, Albir · +34 966 86 48 30 · rett ved stranda, basseng på taket, halvpensjon mulig<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Albir Garden Resort<\/b><span class=\"basis\">Camí Vell d'Altea 29, l'Alfàs del Pi · +34 966 86 59 01 · leilighetsanlegg med eget vannland<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td  en time unna med tog, og PortAventura halvannen. Sentrum trenger dere ikke bo i.<\/p>\n    <div class=\"heroband\">\n      <div><b>8 dager<\/b><small>7 netter<\/small><\/div>\n      <div><b>28<\/b><small>22 elever, 6 voksne<\/small><\/div>\n      <div><b>16 600<\/b><small>kroner per reisende<\/small><\/div>\n      <div><b>464 720<\/b><small>kroner totalt<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"gallery\">\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Platja_de_les_Dunes,_2.jpg?width=1400\" alt=\"Platja de les Dunes, Santa Susanna\"><figcaption>Platja de les Dunes, Santa Susanna<\/figcaption><\/figure>\n    <figure><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Santa_Susanna_Beach.jpg?width=1400\" alt=\"Stranda og hotellene i Santa Susanna\"><figcaption>Stranda og hotellene i Santa Susanna<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Barcelona<\/b><small>Norwegian, direkte · ca. 3 t 20 min<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Barcelona, en time med tog<\/b><span class=\"basis\">Sagrada Família, Park Güell og Camp Nou. Toget går fra Santa Susanna stasjon rett ved hotellene.<\/span><\/li><li><b>Water World i Lloret<\/b><span class=\"basis\">Et av Europas største badeland, 20 minutter nordover — dagsutflukt uten å bo i Lloret.<\/span><\/li><li><b>Tossa de Mar<\/b><span class=\"basis\">Middelalderby med bymur rett i sjøen, en halvtime nordover langs kysten. Båt fra Santa Susanna om sommeren.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strandbase, storby på dagstur<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer og innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Stranda i Santa Susanna og promenaden<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Barcelona<\/b><small>Sagrada Família, Rambla og shopping. Tog fra stasjonen<\/small><\/div><span class=\"act\">230 kr<\/span><\/li><li><div class=\"day\"><b>Strand og basseng<\/b><small>Rolig dag på hotellet<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>PortAventura og Ferrari Land<\/b><small>Heldag med buss, Europas største i sitt slag<\/small><\/div><span class=\"act\">640 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>Kajakk og SUP fra stranda<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Barcelona – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Santa Susanna er valgt framfor Lloret de Mar, som ligger tjue minutter unna og er innrettet mot festeturisme. Togstasjonen i Santa Susanna gjør Barcelona-dagen enkel uten leiebuss.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Hotel Tahiti Playa<\/b><span class=\"basis\">Paseo Marítimo, Santa Susanna · +34 937 03 22 00 · 50 meter fra stranda, to basseng, kort vei til toget<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>Santa Susanna Resort<\/b><span class=\"basis\">N-2 km 673, Santa Susanna · +34 937 67 92 56 · stort anlegg med kapasitet til hele gruppen<\/s r unna<\/b><span class=\"basis\">Katedralen La Seu rett ved sjøen, gamlebyen bak den, og Palma Aquarium med Europas dypeste haibasseng like ved Can Pastilla.<\/span><\/li><li><b>Sørkysten og Es Trenc<\/b><span class=\"basis\">Milelang hvit sandstrand uten hotellrekke, en times buss sørover. Naturreservat, ingen utbygging.<\/span><\/li><li><b>Serra de Tramuntana<\/b><span class=\"basis\">Fjellkjeden på verdensarvlisten langs nordvestkysten. Toget fra Palma til Sóller er 100 år gammelt og går gjennom tretten tunneler.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Strand som base, én utflukt hver dag<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, innsjekk og felles middag<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Rutiner, grenser for hvor de kan bevege seg, bading<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Palma<\/b><small>Katedralen, gamlebyen og shopping i Carrer Sant Miquel<\/small><\/div><span class=\"act\">60 kr<\/span><\/li><li><div class=\"day\"><b>Aqualand El Arenal<\/b><small>Vannpark tjue minutter unna med buss<\/small><\/div><span class=\"act\">470 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>SUP-brett og kajakk fra stranda<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Båttur langs kysten<\/b><small>Til Illetes eller Cala Blava, bading fra båt<\/small><\/div><span class=\"act\">400 kr<\/span><\/li><li><div class=\"day\"><b>Fridag<\/b><small>Strand, shopping, valgfritt opplegg i grupper<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Hjemreise<\/b><small>Palma – Oslo – Alta – Kautokeino<\/small><\/div><span class=\"act\">—<\/span><\/li><\/ol>\n    <p style=\"margin-top:12px;font-size:13px;color:var(--muted)\">Veiledende priser per person, avrundet. Aktiviteter og restauranter er forslag, ikke bestilt.<\/p>\n  <\/section>\n\n  <section>\n    <h2>Overnatting<\/h2>\n    <p class=\"lede\">Ingen av disse er reservert. Can Pastilla er valgt framfor S'Arenal fordi utelivet ligger lenger øst. Med 28 personer trengs rundt 14 rom, og det må avtales direkte med hotellet.<\/p>\n    <table style=\"margin-top:14px\"><tr><td><b>Hotel Las Arenas<\/b><span class=\"basis\">Carrer de Tit Livi 14, Can Pastilla · +34 971 26 07 50 · 75 meter fra stranda, basseng og frokost inkludert<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><tr><td><b>AYA Seahotel<\/b><span class=\"basis\">Carretera de l'Arenal 60, Playa de Palma · +34 971 26 04 50 · basseng på taket, treningsrom og sauna<\/span><\/td><td class=\"num\"><span class=\"tag t-quote\">Tilbud innhentes<\/span><\/td><\/tr><\/table>\n  <\/section>\n\n  <section>\n    <h2>Hva turen koster<\/h2>\n    <table>\n      <tr><th>Post<\/th><th>Grunnlag<\/th><th style=\"text-align:right\">Kroner<\/th><\/tr>\n      <tr><td>Buss Kautokeino–Alta t/r<\/td><td><span class=\"tag t-ok\">Bekreftet<\/span><span class=\"basis\">Kjøring og henting, oppgitt pris<\/span><\/td><td class=\"num\">17 000<\/td><\/tr><tr><td>Fly, 28 personer t/r<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 4 500 · Alta–Oslo anslått til 2 500, Oslo–Palma til 2 000<\/span><\/td><td class=\"num\">126 000<\/td><\/tr><tr><td>Hotell, 7 netter med frokost<\/td><td><span class=\"tag t-quote\">Tilbud innhentes<\/span><span class=\"basis\">28 × 6 500<\/span><\/td><td class=\"num\">182 000<\/td><\/tr><tr><td>Middag ute og lunsj<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 3 200 · fast ungdomsmeny avtalt på forhånd<\/span><\/td><td class=\"num\">89 600<\/td><\/tr><tr><td>Aktiviteter<\/td><td><span class=\"tag t-est\">Estimat<\/span><span class=\"basis\">28 × 1 500 · én per dag, se programmet<\/span><\/td><td class=\"num\">42 000<\/td><\/tr><tr><td>Reiseforsikring for gr <figcaption>Playamar<\/figcaption><\/figure>\n  <\/div>\n\n  <section>\n    <h2>Reisevei<\/h2>\n    <div class=\"route\"><div class=\"leg\"><b>Kautokeino → Alta<\/b><small>Buss · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Alta → Oslo<\/b><small>Norwegian eller SAS · ca. 2 t<\/small><\/div><div class=\"leg\"><b>Oslo → Málaga<\/b><small>Norwegian, direkte · ca. 4 t<\/small><\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>I nærheten<\/h2>\n    <ul class=\"plain near\"><li><b>Málaga, 15 minutter med tog<\/b><span class=\"basis\">Picasso-museet, den romerske teatret og Alcazaba-festningen. Toget går hvert kvarter fra Torremolinos.<\/span><\/li><li><b>Ronda<\/b><span class=\"basis\">Byen som er delt i to av et 120 meter dypt juv, med bro over. Halvannen time innover i landet.<\/span><\/li><li><b>Caminito del Rey<\/b><span class=\"basis\">Klippesti festet i fjellveggen 100 meter over elva, en time nordover. Krever booking i god tid.<\/span><\/li><\/ul>\n  <\/section>\n\n  <section>\n    <h2>Slik ser uka ut<\/h2>\n    <h3>Alt i gangavstand, tog til byen<\/h3>\n    <ol class=\"days\"><li><div class=\"day\"><b>Reisedag<\/b><small>Buss, to fly, transfer og innsjekk<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Strand og bli kjent<\/b><small>Bajondillo og Playamar, promenaden nordover<\/small><\/div><span class=\"act\">—<\/span><\/li><li><div class=\"day\"><b>Málaga<\/b><small>Gamlebyen, Alcazaba og shopping i Calle Larios. Tog fra Torremolinos<\/small><\/div><span class=\"act\">70 kr<\/span><\/li><li><div class=\"day\"><b>Aqualand Torremolinos<\/b><small>Vannpark i gangavstand fra hotellene<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Vannsport<\/b><small>SUP, kajakk og snorkling fra stranda<\/small><\/div><span class=\"act\">350 kr<\/span><\/li><li><div class=\"day\"><b>Benalmádena og Mijas<\/b><small>Kabelbane opp Calamorro, hvit landsby i fjellet<\/small><\/div><span class=\"act\">330 kr<\/span><\/li><
